<script>
const lang=document.documentElement.lang.startsWith('en')?'en':'zh';
const words={zh:{title:'AGS 订阅中心',status:'Status',subscriptions:'Subs',license:'License',count:'5 种格式',hero:'一个链接，自动适配',hint:'自动选择客户端格式，或下载下方指定格式。',open:'打开自适应订阅 ↗',file:'File',format:'Format',modified:'Modified',bytes:'Size',openFile:'Open',download:'Download',adaptive:'自适应',client:'By client',checking:'正在检查订阅中心…',ready:'订阅中心运行正常',failed:'订阅中心检查失败',detail:'已检查订阅文件、入口和页面资源。',limited:'此检查确认订阅中心可访问，不代表节点连接测试。',recheck:'Check again',checked:'检查时间',loading:'正在加载…'},en:{title:'AGS Subscription Center',status:'Status',subscriptions:'Subs',license:'License',count:'5 formats',hero:'One link, the right format',hint:'Match your client automatically, or download a specific format below.',open:'Open adaptive subscription ↗',file:'File',format:'Format',modified:'Modified',bytes:'Size',openFile:'Open',download:'Download',adaptive:'Adaptive',client:'By client',checking:'Checking the subscription center…',ready:'Subscription center is running successfully',failed:'Subscription center check failed',detail:'Subscription files, endpoints and page assets checked.',limited:'This verifies subscription access, not proxy connectivity.',recheck:'Check again',checked:'Checked at',loading:'Loading…'}};
const t=words[lang];document.querySelectorAll('[data-bytes]').forEach(e=>{const n=Number(e.dataset.bytes);e.textContent=n>=1000?Number((n/1000).toFixed(2))+'KB':n+'B'});document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t[e.dataset.i18n]);document.querySelector('nav').ariaLabel=lang==='zh'?'导航':'Navigation';document.querySelectorAll('[data-adaptive]').forEach(e=>e.textContent=t[e.dataset.adaptive]);document.querySelectorAll('a[download] svg').forEach(e=>e.setAttribute('aria-hidden','true'));document.querySelectorAll('.file-open').forEach(e=>{e.setAttribute('aria-label',t.openFile+' '+e.dataset.file);e.title=t.openFile});document.querySelectorAll('.file-download').forEach(e=>e.setAttribute('aria-label',t.download+' '+e.dataset.file));
let checkRunning=false;
async function checkStatus(){if(checkRunning)return;checkRunning=true;document.getElementById('recheck').disabled=true;const card=document.getElementById('status-card');card.className='status-card';document.getElementById('status-title').textContent=t.checking;document.getElementById('status-detail').textContent=t.limited;const probes=[['raw','raw'],['base64','base64'],['clash','clash'],['sing-box','sing-box'],['auto','auto'],['HTML','index.html'],['SVG','favicon.svg'],['QR','auto-qr.svg']];const results=await Promise.all(probes.map(async([label,url])=>{try{const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(8000)});const body=await response.text();if(!response.ok)throw Error('HTTP '+response.status);if(!body.trim())throw Error('Empty response');if(url==='sing-box'){const data=JSON.parse(body);if(!Array.isArray(data.outbounds)||!data.outbounds.length)throw Error('Invalid outbounds')}if(url==='raw'&&!body.trim().split(/\r?\n/).every(line=>/^(vless|vmess|trojan):\/\//.test(line)))throw Error('Invalid URI');if(url==='base64'){if(!/^(vless|vmess|trojan):\/\//.test(atob(body.trim())))throw Error('Invalid Base64')}if(url==='clash'&&!/^proxies:/m.test(body))throw Error('Invalid YAML');if(url==='auto'){let valid=false;try{valid=/^(vless|vmess|trojan):\/\//.test(atob(body.trim()))}catch{}if(!valid&&!/^proxies:/m.test(body)){const data=JSON.parse(body);if(!Array.isArray(data.outbounds)||!data.outbounds.length)throw Error('Invalid subscription')}}if(url==='index.html'&&!body.includes('data-view="status"'))throw Error('Invalid HTML');if(url.endsWith('.svg')&&!body.includes('<svg'))throw Error('SVG');return{label,ok:true}}catch(error){return{label,ok:false,reason:error.name==='TimeoutError'?'Timeout':error.message||'Network error'}}}));const ok=results.every(r=>r.ok);card.classList.add(ok?'ok':'error');document.getElementById('status-title').textContent=ok?t.ready:t.failed;document.getElementById('status-detail').textContent=t.limited;document.getElementById('checks').replaceChildren(...results.map(r=>{const e=document.createElement('div');e.className='check'+(r.ok?'':' error');e.textContent=(r.ok?'✓ ':'✗ ')+r.label;if(!r.ok){const reason=document.createElement('small');reason.textContent=r.reason;e.append(reason)}return e}));document.getElementById('checked-at').textContent=t.checked+' · '+new Date().toLocaleTimeString(lang==='zh'?'zh-CN':'en-GB');checkRunning=false;document.getElementById('recheck').disabled=false}
document.getElementById('recheck').addEventListener('click',checkStatus);
function navigate(){const name=['status'].includes(location.hash.slice(1))?location.hash.slice(1):'subscriptions';document.querySelectorAll('.view').forEach(e=>e.hidden=e.id!==name);document.querySelectorAll('[data-view]').forEach(e=>{const active=e.dataset.view===name;e.classList.toggle('active',active);if(active)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current')});if(name==='status')checkStatus()}
document.querySelectorAll('[data-view]').forEach(e=>e.addEventListener('click',event=>{event.preventDefault();location.hash=e.dataset.view}));window.addEventListener('hashchange',navigate);navigate();
</script></body></html>
